[project]
name = "sarsim"
version = "0.1.0"
description = "Search-and-rescue simulation environment with gRPC/WebSocket API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "fastapi",
    "uvicorn",
    "grpcio",
    "grpcio-tools",
    "protobuf",
    "websockets",
    "aiohttp",
    "pygame",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "mypy==2.4.1",
    "ruff==0.17.4",
    "httpx==0.28.1",
    "httpx2==2.16.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
