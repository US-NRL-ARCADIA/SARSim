name: Test and Lint

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Check installer syntax
        run: |
          bash -n install.sh
          sh -n run.sh
          bash install.sh --help
          cat install.sh | bash -s -- --help

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy src

      - name: Run tests
        run: uv run pytest

      - name: Verify packaged UI
        run: |
          uv build
          uv run python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          required = {
              "src/ui/index.html",
              "src/ui/app.js",
              "src/ui/scene3d.js",
              "src/ui/styles.css",
              "src/ui/nrl-official.jpg",
              "src/ui/vendor/golden-layout.esm.js",
              "src/ui/vendor/three.module.js",
              "src/ui/vendor/three.core.js",
          }
          with ZipFile(wheel) as archive:
              missing = required.difference(archive.namelist())
          if missing:
              raise SystemExit(f"Wheel is missing UI assets: {sorted(missing)}")
          PY
